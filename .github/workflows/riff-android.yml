name: riff-android

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  android:
    name: "Android app"
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and NDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/**/*.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Generate Spotify API crate
        run: ./scripts/generate-spotify-api.sh

      - name: Decode release keystore
        env:
          RIFF_KEYSTORE_BASE64: ${{ secrets.RIFF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RIFF_KEYSTORE_BASE64" ]; then
            echo "$RIFF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/riff-release.jks"
            echo "RIFF_KEYSTORE=$RUNNER_TEMP/riff-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; the APK will be unsigned."
          fi

      - name: Build release APK
        env:
          RIFF_KEYSTORE_PASSWORD: ${{ secrets.RIFF_KEYSTORE_PASSWORD }}
          RIFF_KEY_ALIAS: ${{ secrets.RIFF_KEY_ALIAS }}
          RIFF_KEY_PASSWORD: ${{ secrets.RIFF_KEY_PASSWORD }}
        run: ./scripts/build-android.sh release

      - name: Run tests
        run: ./scripts/test-android.sh

      - name: Name the APK
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p build/android
          cp android/app/build/outputs/apk/release/*.apk "build/android/Riff-${VERSION}.apk"
          # Two ABIs of the Rust core and Gradle caches add up; free space for
          # the cache upload.
          rm -rf target/aarch64-linux-android target/x86_64-linux-android

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Riff-Android
          path: build/android/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/android/*.apk --clobber
