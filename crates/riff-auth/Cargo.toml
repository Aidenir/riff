[package]
name = "riff-auth"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Riff's Authentication crate."

[features]
default = ["secret-service"]
# Stores credentials through the freedesktop Secret Service. Without it, macOS
# builds use the login Keychain.
secret-service = ["dep:oo7"]

[dependencies]

oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
url = "2.4.1"
thiserror = "2.0.20"
log = "0.4.17"
serde_json = "1.0.96"
anyhow = "1.0.102"
oo7 = { version = "0.6.0", optional = true }

[dependencies.serde]
version = "1.0.136"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["rt", "macros", "sync", "time", "io-util", "net"]

# rustls on Android, which has no system OpenSSL (see riff-api).
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
