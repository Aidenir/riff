[package]
name = "riff-config"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Riff's user and app configuration."

[features]
default = ["gsettings"]
# User settings stored in GSettings. The macOS client keeps its own store and
# only uses the shared constants and flag definitions.
gsettings = ["dep:gio"]

[dependencies]
gio = { version = "0.22", optional = true }
log = "0.4.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.96"
