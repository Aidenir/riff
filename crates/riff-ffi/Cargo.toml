[package]
name = "riff-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Swift and Kotlin bindings over the Riff core, used by the macOS and Android clients."

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "riff_ffi"

# The core only targets macOS and Android. On Linux the crate compiles to
# nothing, so `cargo check --workspace` there does not pull in rodio or the
# bindings.
[target.'cfg(any(target_os = "macos", target_os = "android"))'.dependencies]
riff-api = { path = "../riff-api", default-features = false }
riff-auth = { path = "../riff-auth", default-features = false }
riff-config = { path = "../riff-config", default-features = false }
riff-core = { path = "../riff-core" }
riff-player = { path = "../riff-player", features = ["rodio-backend"] }
uniffi = { version = "0.32", features = ["tokio"] }
futures = "0.3.18"
log = "0.4.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.96"
thiserror = "2.0.20"
url = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies.librespot]
version = "0.8.0"
default-features = false
features = ["native-tls"]

# Android has no system OpenSSL, so TLS goes through rustls (see riff-api).
# cpal finds the audio APIs through ndk-context, set up from JNI.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "android")'.dependencies.librespot]
version = "0.8.0"
default-features = false
features = ["rustls-tls-webpki-roots"]

[target.'cfg(any(target_os = "macos", target_os = "android"))'.dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "macros", "sync", "time"]
