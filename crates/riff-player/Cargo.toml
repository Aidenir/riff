[package]
name = "riff-player"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Riff's librespot session and local playback management."

[features]
alsa-backend = ["librespot/alsa-backend"]
pulseaudio-backend = ["librespot/pulseaudio-backend"]
rodio-backend = ["librespot/rodio-backend"]

[dependencies]
riff-api = { path = "../riff-api", default-features = false }
riff-audio-engine = { path = "../riff-audio-engine" }
riff-auth = { path = "../riff-auth", default-features = false }
futures = "0.3.18"
log = "0.4.17"
url = "2.4.1"

[dependencies.librespot]
version = "0.8.0"
default-features = false
features = ["native-tls"]

[dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "macros", "sync", "time"]
